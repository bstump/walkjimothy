<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walk Jimothy</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <h1>Walk Jimothy</h1>
      <canvas id="game" width="960" height="460"></canvas>
      <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
      <p class="hint">Press Space, ↑, or W to jump. Tap the screen to play.</p>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
